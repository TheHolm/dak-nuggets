# Builds and publishes release artifacts to a GitHub Release. Only ever runs
# on tag pushes matching v* (this repo's tag convention - a single date-based
# tag per collection release, e.g. v2026.09.22, with v2026.09.22-1, -2, ... for
# further releases on the same day; see AGENTS.md's "Branching & releases"
# convention). Never runs on ordinary branch pushes or pull
# requests, and tags themselves are always created manually - this workflow
# never creates one itself.
#
# There is exactly one build step per target platform:
#
#   build-deb-trixie      Debian trixie .deb packages
#   build-deb-ubuntu2604  Ubuntu 26.04 LTS .deb packages
#   build-freebsd-pkg     FreeBSD .pkg packages (best effort, see below)
#
# Each step sets up its target's build environment once and then builds every
# program (discovered by the presence of a `<program>/ci-deb.sh` or
# `<program>/ci-freebsd.sh` script) plus the combined "all programs" bundle
# package for that target. This avoids standing up a separate build
# environment per program, which would get expensive fast. The per-program,
# per-language build recipes live in the program directories; the shared
# packaging mechanics live in scripts/ - see NOTES.md.
#
# The three steps are independent of each other (`depends_on: []` puts the
# workflow into DAG mode, so they run concurrently; publish-github-release
# waits for all of them). Because CI steps share one workspace, every step
# writes to target-specific build/stage directories and each per-program
# script wipes its own build directory first, so concurrent steps (and
# re-runs in a persisted workspace) can never collide on a stale Meson build
# directory - see NOTES.md.
#
# FreeBSD packaging never uses a real FreeBSD host: the base system
# (libc/CRT/headers) comes from selectively extracting the official base.txz
# release set, and each program's own native dependency closure (e.g.
# evolution-data-server for gnome-next-meeting) is resolved live against the
# real FreeBSD package repository by scripts/fetch-freebsd-deps.py - see
# NOTES.md. That live-repository layout is not a stable public interface, so
# the FreeBSD step is marked `failure: ignore`: a break there never blocks the
# Linux .deb releases.
#
# Requirements for this to work:
#   - A `github_token` secret is set on this repo in Woodpecker (Project
#     Settings -> Secrets), holding a GitHub PAT scoped to Contents:
#     read/write, restricted to the "tag" event.
#   - The repo's push mirror to GitHub is set up and syncs tags promptly, so
#     the tag this workflow is releasing already exists on GitHub.
#
# Every step starts by chmod'ing the scripts it is about to run: this pipeline
# deliberately does not trust the checked-out file modes. A clone can arrive
# with the executable bit stripped (a mirror or rsync that doesn't preserve
# modes, a Windows-hosted working copy, or simply a bad commit), and without
# this the whole release fails with a bare "Permission denied" - for a reason
# that has nothing to do with the release. The chmod fixes the bit on disk in
# the shared workspace, so the nested calls inside scripts/ and
# <program>/ci-*.sh are covered too, not just the invocations in this file.
# Don't remove it as redundant just because the modes happen to be right in
# git today - see NOTES.md.
#
# Every step also defines a `step_done` shell function right after that chmod,
# printing how long the commands since the previous call (or since the start
# of the step) took, in the same "MmSs" style as scripts/lib-timing.sh (which
# the per-program/orchestrator scripts source instead - this inline copy
# exists because Woodpecker runs each step's commands under the image's
# default `/bin/sh`, not bash, so `lib-timing.sh`'s bash-only $SECONDS is not
# available here; `date +%s` is POSIX). This is for narrowing down *within*
# one CI step where time goes - Woodpecker's own UI/API already reports each
# step's total start/finish time on its own, with no changes needed here; see
# NOTES.md.

when:
  - event: tag
    ref: refs/tags/v*

steps:
  - name: build-deb-trixie
    image: debian:trixie-slim
    depends_on: []
    environment:
      # Union of every program's runtime dependencies for this target, used for
      # the bundle package's Depends field and forwarded to each program's
      # ci-deb.sh. Note opencode-podman-status deliberately ignores it (Rust
      # links statically, so it has none) - see the "Adding a new program's
      # release steps" checklist in NOTES.md.
      DEB_DEPENDS: "libecal-2.0-3, libedataserver-1.2-27t64"
    commands:
      # File modes are not trusted - see the note in this file's header.
      - chmod +x scripts/*.sh */ci-*.sh
      # See "Every step also defines a step_done" in this file's header.
      - step_start=$(date +%s); step_done() { t=$(date +%s); echo "== $1: $(( (t-step_start)/60 ))m$(( (t-step_start)%60 ))s =="; step_start=$t; }
      # Union of every program's build dependencies for this target.
      # ca-certificates must be explicit: cargo fetches crates over HTTPS, and
      # --no-install-recommends drops it (it is only a Recommends). See NOTES.md.
      - apt-get update && apt-get install -y --no-install-recommends build-essential meson ninja-build pkg-config libglib2.0-dev libecal2.0-dev libedataserver1.2-dev dpkg-dev cargo ca-certificates
      - step_done "apt-get install"
      - ./scripts/build-target-debs.sh "1~trixie" amd64 trixie
      - step_done "build-target-debs.sh"

  - name: build-deb-ubuntu2604
    image: ubuntu:26.04
    depends_on: []
    environment:
      # Runtime package names verified against the Ubuntu 26.04 (resolute)
      # archive: libecal-2.0-3 and libedataserver-1.2-27t64 both exist there
      # at 3.56.2-8. Re-check if a future LTS renames them. See NOTES.md.
      DEB_DEPENDS: "libecal-2.0-3, libedataserver-1.2-27t64"
    commands:
      # File modes are not trusted - see the note in this file's header.
      - chmod +x scripts/*.sh */ci-*.sh
      # See "Every step also defines a step_done" in this file's header.
      - step_start=$(date +%s); step_done() { t=$(date +%s); echo "== $1: $(( (t-step_start)/60 ))m$(( (t-step_start)%60 ))s =="; step_start=$t; }
      # Same list as build-deb-trixie, including the explicit ca-certificates.
      - apt-get update && apt-get install -y --no-install-recommends build-essential meson ninja-build pkg-config libglib2.0-dev libecal2.0-dev libedataserver1.2-dev dpkg-dev cargo ca-certificates
      - step_done "apt-get install"
      - ./scripts/build-target-debs.sh "1~ubuntu2604" amd64 ubuntu2604
      - step_done "build-target-debs.sh"

  - name: build-freebsd-pkg
    image: debian:trixie-slim
    depends_on: []
    # Best effort: each program's FreeBSD dependency closure is resolved live
    # against the real FreeBSD package repository, whose layout is not a
    # stable public interface. A break here is reported but never blocks the
    # Linux releases. See NOTES.md.
    failure: ignore
    environment:
      PKG_CONFIG_ALLOW_CROSS: "1"
      PKG_CONFIG_SYSROOT_DIR: /opt/freebsd-sysroot
      PKG_CONFIG_LIBDIR: /opt/freebsd-sysroot/usr/local/libdata/pkgconfig:/opt/freebsd-sysroot/usr/local/lib/pkgconfig
    commands:
      # File modes are not trusted - see the note in this file's header.
      - chmod +x scripts/*.sh */ci-*.sh
      # See "Every step also defines a step_done" in this file's header.
      - step_start=$(date +%s); step_done() { t=$(date +%s); echo "== $1: $(( (t-step_start)/60 ))m$(( (t-step_start)%60 ))s =="; step_start=$t; }
      # Union of every program's build dependencies for this target.
      - apt-get update && apt-get install -y --no-install-recommends clang lld binutils zstd xz-utils python3 meson ninja-build pkg-config curl ca-certificates
      - step_done "apt-get install"
      - mkdir -p /opt/freebsd-sysroot
      # FreeBSD base system. Every member needs the leading `./`; extract
      # members explicitly, not via a file list. See TheHolm/dak's NOTES.md
      # section 1.4a - re-verify this list if scripts/check-target-freshness.sh
      # flags the FreeBSD pin as stale (sonames do change between releases).
      - curl -fsSL -o /tmp/base.txz https://download.freebsd.org/releases/amd64/amd64/15.1-RELEASE/base.txz
      - step_done "download base.txz"
      - >-
        tar -xJf /tmp/base.txz -C /opt/freebsd-sysroot
        ./lib/libc.so.7 ./usr/lib/libc.so ./usr/lib/libc_nonshared.a
        ./lib/libm.so.5 ./usr/lib/libm.so
        ./lib/libutil.so.10 ./usr/lib/libutil.so
        ./lib/librt.so.1 ./usr/lib/librt.so
        ./lib/libthr.so.3 ./usr/lib/libthr.so ./usr/lib/libpthread.so
        ./lib/libgcc_s.so.1 ./usr/lib/libgcc_s.so
        ./usr/lib/libgcc.a ./usr/lib/libgcc_eh.a ./usr/lib/libcompiler_rt.a
        ./usr/lib/crt1.o ./usr/lib/Scrt1.o ./usr/lib/crti.o ./usr/lib/crtn.o
        ./usr/lib/crtbegin.o ./usr/lib/crtbeginS.o ./usr/lib/crtbeginT.o
        ./usr/lib/crtend.o ./usr/lib/crtendS.o
        ./usr/include
      # `libgcc.a`/`libgcc_eh.a` (dangling without `libcompiler_rt.a`, its
      # symlink target) and `usr/include` (the whole C header tree) are only
      # needed for *C* programs built with a plain `clang ... -o prog` link
      # line - clang's default FreeBSD driver spec unconditionally appends
      # `-lgcc`/`-lgcc_s` to the link, and obviously every C source needs
      # libc's headers. Rust binaries (as in TheHolm/dak/md_timesheet) never
      # hit either of these: rustc controls its own link line and never asks
      # clang for `-lgcc`, and it needs no C headers at all. See NOTES.md.
      - rm -f /tmp/base.txz
      - step_done "extract base.txz"
      # Union of every program's FreeBSD dependency closures, fetched from
      # pkg.freebsd.org - see scripts/fetch-freebsd-deps.py. Add one --root
      # per program (plus --pkg-config-check for modules to verify resolve).
      #
      # The --exclude list below prunes evolution-data-server's own optional
      # runtime features that gnome-next-meeting's use of libecal-2.0 /
      # libedataserver-1.2 never touches. databases/evolution-data-server's
      # OPTIONS_DEFAULT enables all of these on the official binary package
      # (confirmed against its Makefile on cgit.freebsd.org, not guessed -
      # see NOTES.md), and without pruning them the closure balloons to 186
      # packages / ~737 MB, most of it WebKitGTK (an embedded browser engine
      # for OAuth2 account sign-in) and GTK4 (needed only by that same OAuth2
      # feature and by nothing else gnome-next-meeting links against):
      #   - OAUTH2 (combined with GTK4 on) + GTK4: webkit2-gtk_60, gtk4, and
      #     everything only reachable through them (GStreamer, ICU, image/font
      #     codec libs, graphene, vulkan-loader, ...)
      #   - BDB: db5
      #   - CANBERRA: libcanberra-gtk3, libcanberra
      #   - LDAP: openldap26-client (name is version-pinned - re-check
      #     Mk/bsd.default-versions.mk's OPENLDAP_DEFAULT if this starts
      #     failing to match anything)
      #   - WEATHER: libgweather4, geocode-glib2
      # GSSAPI_BASE (also OPTIONS_DEFAULT) needs no exclude: USES=gssapi:base
      # links the FreeBSD base system's own Kerberos, adding no package at
      # all - see Mk/Uses/gssapi.mk.
      # If evolution-data-server's OPTIONS_DEFAULT changes upstream, re-derive
      # this list the same way (read the port's Makefile on cgit.freebsd.org)
      # rather than guessing from package names.
      - >-
        python3 scripts/fetch-freebsd-deps.py --sysroot /opt/freebsd-sysroot
        --root evolution-data-server
        --exclude webkit2-gtk_60 --exclude gtk4
        --exclude db5
        --exclude libcanberra-gtk3 --exclude libcanberra
        --exclude openldap26-client
        --exclude libgweather4 --exclude geocode-glib2
        --pkg-config-check libecal-2.0 --pkg-config-check libedataserver-1.2
        --deps-output /opt/freebsd-deps.json
      - step_done "fetch-freebsd-deps.py"
      # A generic Meson cross-file for the FreeBSD target, shared by every C
      # program. (A future non-Meson program - Rust, Go, ... - would need its
      # own toolchain setup here; that part can't be shared across languages.)
      - >-
        printf '%s\n'
        "[binaries]" "c = 'clang'" "ar = 'ar'" "strip = 'strip'" "pkg-config = 'pkg-config'"
        "[host_machine]" "system = 'freebsd'" "cpu_family = 'x86_64'" "cpu = 'x86_64'" "endian = 'little'"
        "[properties]" "sys_root = '/opt/freebsd-sysroot'"
        "[built-in options]"
        "c_args = ['--target=x86_64-unknown-freebsd15', '--sysroot=/opt/freebsd-sysroot']"
        "c_link_args = ['--target=x86_64-unknown-freebsd15', '--sysroot=/opt/freebsd-sysroot', '-fuse-ld=lld', '-B/opt/freebsd-sysroot/usr/lib']"
        > /opt/freebsd-cross.ini
      - ./scripts/build-target-freebsd.sh /opt/freebsd-cross.ini /opt/freebsd-deps.json
      - step_done "build-target-freebsd.sh"

  - name: publish-github-release
    image: debian:trixie-slim
    depends_on:
      - build-deb-trixie
      - build-deb-ubuntu2604
      - build-freebsd-pkg
    environment:
      GH_TOKEN:
        from_secret: github_token
    commands:
      # File modes are not trusted - see the note in this file's header. This
      # step runs no <program>/ci-*.sh, so the glob stays narrow: under /bin/sh
      # an unmatched glob would be passed through literally and fail the step.
      - chmod +x scripts/*.sh
      # See "Every step also defines a step_done" in this file's header.
      - step_start=$(date +%s); step_done() { t=$(date +%s); echo "== $1: $(( (t-step_start)/60 ))m$(( (t-step_start)%60 ))s =="; step_start=$t; }
      - apt-get update && apt-get install -y --no-install-recommends ca-certificates curl gnupg
      - mkdir -p -m 755 /etc/apt/keyrings
      - curl -fsSL https://cli.github.com/packages/githubcli-archive-keyring.gpg -o /etc/apt/keyrings/githubcli-archive-keyring.gpg
      - chmod go+r /etc/apt/keyrings/githubcli-archive-keyring.gpg
      - echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main" > /etc/apt/sources.list.d/github-cli.list
      - apt-get update && apt-get install -y --no-install-recommends gh
      - step_done "install gh"
      - ./scripts/extract-release-notes.sh "$CI_COMMIT_TAG" RELEASE_NOTES.md > /tmp/release-notes.md
      # Idempotent: create the release, or update it in place when a tag is
      # re-released, so republishing the same tag never fails.
      - |
        if gh release view "$CI_COMMIT_TAG" --repo TheHolm/dak-nuggets >/dev/null 2>&1; then
          gh release edit "$CI_COMMIT_TAG" \
            --repo TheHolm/dak-nuggets \
            --title "$CI_COMMIT_TAG" \
            --notes-file /tmp/release-notes.md
          gh release upload "$CI_COMMIT_TAG" dist/* \
            --repo TheHolm/dak-nuggets \
            --clobber
        else
          gh release create "$CI_COMMIT_TAG" dist/* \
            --repo TheHolm/dak-nuggets \
            --title "$CI_COMMIT_TAG" \
            --notes-file /tmp/release-notes.md
        fi
      - step_done "gh release create/upload"

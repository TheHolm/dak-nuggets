# Builds and publishes release artifacts to a GitHub Release. Only ever runs
# on tag pushes matching v* (this repo's tag convention - a single date-based
# tag per collection release, e.g. v2026.09.22; see AGENTS.md's "Branching &
# releases" convention). Never runs on ordinary branch pushes or pull
# requests, and tags themselves are always created manually - this workflow
# never creates one itself.
#
# dak-nuggets packages more than one program under one repo (see AGENTS.md),
# each independently versioned. Every tagged release rebuilds and republishes
# EVERY program's packages at their current versions, plus one additional
# "bundle" package per target that contains every program together. There is
# no dynamic matrix over repo contents here - Woodpecker YAML can't loop over
# directories - so adding a new program means manually adding its own three
# steps (deb-trixie, deb-ubuntu2604, freebsd-pkg) below, plus wiring it into
# the three bundle-* steps. See NOTES.md's "Adding a new program's release
# steps" checklist before adding one.
#
# Per program, per target, independent of every other program/target
# (`depends_on: []` puts the whole workflow into DAG mode, so they all run
# concurrently); each bundle-* step depends only on the individual steps for
# its own target; publish-github-release waits for everything.
#
# FreeBSD packaging never uses a real FreeBSD host: the base system
# (libc/CRT) comes from selectively extracting the official base.txz release
# set, and each program's own native dependency closure (e.g.
# evolution-data-server for gnome-next-meeting) is resolved live against the
# real FreeBSD package repository by scripts/fetch-freebsd-deps.py - see
# NOTES.md. That live-repository layout is not a stable public interface, so
# every *-freebsd-pkg step is marked `failure: ignore`: a break there never
# blocks the Linux .deb releases.
#
# Requirements for this to work:
#   - A `github_token` secret is set on this repo in Woodpecker (Project
#     Settings -> Secrets), holding a GitHub PAT scoped to Contents:
#     read/write, restricted to the "tag" event.
#   - The repo's push mirror to GitHub is set up and syncs tags promptly, so
#     the tag this workflow is releasing already exists on GitHub.

when:
  - event: tag
    ref: refs/tags/v*

steps:
  # ---------------------------------------------------------------------
  # gnome-next-meeting
  # ---------------------------------------------------------------------

  - name: gnome-next-meeting-deb-trixie
    image: debian:trixie-slim
    depends_on: []
    commands:
      - apt-get update && apt-get install -y --no-install-recommends build-essential meson ninja-build pkg-config libglib2.0-dev libecal2.0-dev libedataserver1.2-dev dpkg-dev
      - cd gnome-next-meeting
      - VERSION=$(grep -m1 "version:" meson.build | sed -E "s/.*version:[[:space:]]*'([^']+)'.*/\1/")
      - make install DESTDIR=$(pwd)/stage-root-trixie PREFIX=/usr/local
      - mkdir -p ../dist
      - >-
        ../scripts/build-deb.sh
        --name gnome-next-meeting --version "$VERSION" --revision 1~trixie --arch amd64
        --stage-root stage-root-trixie
        --output ../dist/gnome-next-meeting_${VERSION}-1~trixie_amd64.deb
        --synopsis "Time until the next calendar meeting, for DAK"
        --description "Prints HH:MM until the next calendar event of the day by reading Evolution Data Server, for use as a DAK text_exec button."
        --depends "libecal-2.0-3, libedataserver-1.2-27t64"
      # Fail the release if the binary did not make it into the .deb.
      - dpkg-deb -c ../dist/gnome-next-meeting_*-1~trixie_amd64.deb | grep -qF 'usr/local/bin/gnome-next-meeting'

  - name: gnome-next-meeting-deb-ubuntu2604
    image: ubuntu:26.04
    depends_on: []
    commands:
      - apt-get update && apt-get install -y --no-install-recommends build-essential meson ninja-build pkg-config libglib2.0-dev libecal2.0-dev libedataserver1.2-dev dpkg-dev
      - cd gnome-next-meeting
      - VERSION=$(grep -m1 "version:" meson.build | sed -E "s/.*version:[[:space:]]*'([^']+)'.*/\1/")
      - make install DESTDIR=$(pwd)/stage-root-ubuntu2604 PREFIX=/usr/local
      - mkdir -p ../dist
      # NOTE: the exact runtime package names/versions below (e.g. the
      # "-27t64" suffix) were verified against Debian trixie only - Ubuntu
      # 26.04 does not exist yet at the time this pipeline was written.
      # Verify these against the real Ubuntu 26.04 archive once available
      # (`apt-cache policy libecal-2.0-3 libedataserver-1.2-27t64`) and update
      # if the suffix differs; see NOTES.md.
      - >-
        ../scripts/build-deb.sh
        --name gnome-next-meeting --version "$VERSION" --revision 1~ubuntu2604 --arch amd64
        --stage-root stage-root-ubuntu2604
        --output ../dist/gnome-next-meeting_${VERSION}-1~ubuntu2604_amd64.deb
        --synopsis "Time until the next calendar meeting, for DAK"
        --description "Prints HH:MM until the next calendar event of the day by reading Evolution Data Server, for use as a DAK text_exec button."
        --depends "libecal-2.0-3, libedataserver-1.2-27t64"
      - dpkg-deb -c ../dist/gnome-next-meeting_*-1~ubuntu2604_amd64.deb | grep -qF 'usr/local/bin/gnome-next-meeting'

  - name: gnome-next-meeting-freebsd-pkg
    image: debian:trixie-slim
    depends_on: []
    # Best effort: gnome-next-meeting's FreeBSD dependency closure
    # (evolution-data-server and everything under it) is resolved live
    # against the real FreeBSD package repository, whose layout is not a
    # stable public interface. A break here is reported but never blocks the
    # Linux releases. See NOTES.md.
    failure: ignore
    environment:
      PKG_CONFIG_ALLOW_CROSS: "1"
      PKG_CONFIG_SYSROOT_DIR: /opt/freebsd-sysroot
      PKG_CONFIG_LIBDIR: /opt/freebsd-sysroot/usr/local/libdata/pkgconfig:/opt/freebsd-sysroot/usr/local/lib/pkgconfig
    commands:
      - apt-get update && apt-get install -y --no-install-recommends clang lld binutils zstd xz-utils python3 meson ninja-build pkg-config curl ca-certificates
      - mkdir -p /opt/freebsd-sysroot
      # FreeBSD base system for libc/CRT. Every member needs the leading
      # `./`; extract members explicitly, not via a file list. See
      # TheHolm/dak's NOTES.md section 1.4a - re-verify this list against a
      # newer base.txz if scripts/check-target-freshness.sh flags the FreeBSD
      # pin as stale (sonames do change between releases).
      - curl -fsSL -o /tmp/base.txz https://download.freebsd.org/releases/amd64/amd64/15.1-RELEASE/base.txz
      - >-
        tar -xJf /tmp/base.txz -C /opt/freebsd-sysroot
        ./lib/libc.so.7 ./usr/lib/libc.so ./usr/lib/libc_nonshared.a
        ./lib/libm.so.5 ./usr/lib/libm.so
        ./lib/libutil.so.10 ./usr/lib/libutil.so
        ./lib/librt.so.1 ./usr/lib/librt.so
        ./lib/libthr.so.3 ./usr/lib/libthr.so ./usr/lib/libpthread.so
        ./lib/libgcc_s.so.1 ./usr/lib/libgcc_s.so
        ./usr/lib/libgcc.a ./usr/lib/libgcc_eh.a ./usr/lib/libcompiler_rt.a
        ./usr/lib/crt1.o ./usr/lib/Scrt1.o ./usr/lib/crti.o ./usr/lib/crtn.o
        ./usr/lib/crtbegin.o ./usr/lib/crtbeginS.o ./usr/lib/crtbeginT.o
        ./usr/lib/crtend.o ./usr/lib/crtendS.o
        ./usr/include
      # `libgcc.a`/`libgcc_eh.a` (dangling without `libcompiler_rt.a`, its
      # symlink target) and `usr/include` (the whole C header tree) are only
      # needed for *C* programs built with a plain `clang ... -o prog` link
      # line - clang's default FreeBSD driver spec unconditionally appends
      # `-lgcc`/`-lgcc_s` to the link, and obviously every C source needs
      # libc's headers. Rust binaries (as in TheHolm/dak/md_timesheet) never
      # hit either of these: rustc controls its own link line and never asks
      # clang for `-lgcc`, and it needs no C headers at all. See NOTES.md.
      - rm -f /tmp/base.txz
      # evolution-data-server and its full dependency closure, fetched from
      # pkg.freebsd.org - see scripts/fetch-freebsd-deps.py.
      - >-
        python3 scripts/fetch-freebsd-deps.py --sysroot /opt/freebsd-sysroot
        --root evolution-data-server
        --pkg-config-check libecal-2.0 --pkg-config-check libedataserver-1.2
        --deps-output /opt/freebsd-deps.json
      - >-
        printf '%s\n'
        "[binaries]" "c = 'clang'" "ar = 'ar'" "strip = 'strip'" "pkg-config = 'pkg-config'"
        "[host_machine]" "system = 'freebsd'" "cpu_family = 'x86_64'" "cpu = 'x86_64'" "endian = 'little'"
        "[properties]" "sys_root = '/opt/freebsd-sysroot'"
        "[built-in options]"
        "c_args = ['--target=x86_64-unknown-freebsd15', '--sysroot=/opt/freebsd-sysroot']"
        "c_link_args = ['--target=x86_64-unknown-freebsd15', '--sysroot=/opt/freebsd-sysroot', '-fuse-ld=lld', '-B/opt/freebsd-sysroot/usr/lib']"
        > /opt/freebsd-cross.ini
      - cd gnome-next-meeting
      - VERSION=$(grep -m1 "version:" meson.build | sed -E "s/.*version:[[:space:]]*'([^']+)'.*/\1/")
      - meson setup build-freebsd --cross-file /opt/freebsd-cross.ini --prefix=/usr/local
      - meson compile -C build-freebsd
      - mkdir -p stage-root-freebsd/usr/local/bin ../dist
      - DESTDIR=$(pwd)/stage-root-freebsd meson install -C build-freebsd
      - >-
        python3 ../scripts/build-freebsd-pkg.py
        --name gnome-next-meeting --origin "sysutils/gnome-next-meeting"
        --version "$VERSION" --stage-root stage-root-freebsd
        --deps-file /opt/freebsd-deps.json
        --comment "Time until the next calendar meeting, for DAK"
        --desc "Prints HH:MM until the next calendar event of the day by reading Evolution Data Server, for use as a DAK text_exec button."
        --www "https://github.com/TheHolm/dak-nuggets"
        --output ../dist/gnome-next-meeting-${VERSION}-freebsd-amd64.pkg
      - zstd -dc ../dist/gnome-next-meeting-*-freebsd-amd64.pkg | tar -tf - | grep -qF 'usr/local/bin/gnome-next-meeting'

  # ---------------------------------------------------------------------
  # Bundle packages: every program together, one per target. With only one
  # program in the repo so far these are a trivial superset of its own
  # package, but the mechanism is in place for when a second program lands -
  # see NOTES.md's checklist.
  # ---------------------------------------------------------------------

  - name: bundle-deb-trixie
    image: debian:trixie-slim
    depends_on: [gnome-next-meeting-deb-trixie]
    commands:
      - apt-get update && apt-get install -y --no-install-recommends dpkg-dev
      - TAG_VERSION=${CI_COMMIT_TAG#v}
      - >-
        ./scripts/merge-stage-roots.sh --output stage-bundle-trixie
        gnome-next-meeting/stage-root-trixie
      - >-
        ./scripts/build-deb.sh
        --name dak-nuggets --version "$TAG_VERSION" --revision 1~trixie --arch amd64
        --stage-root stage-bundle-trixie
        --output dist/dak-nuggets_${TAG_VERSION}-1~trixie_amd64.deb
        --synopsis "All dak-nuggets helper programs, for DAK"
        --description "Bundles every dak-nuggets helper program (see README.markdown) into a single package."
        --depends "libecal-2.0-3, libedataserver-1.2-27t64"

  - name: bundle-deb-ubuntu2604
    image: ubuntu:26.04
    depends_on: [gnome-next-meeting-deb-ubuntu2604]
    commands:
      - apt-get update && apt-get install -y --no-install-recommends dpkg-dev
      - TAG_VERSION=${CI_COMMIT_TAG#v}
      - >-
        ./scripts/merge-stage-roots.sh --output stage-bundle-ubuntu2604
        gnome-next-meeting/stage-root-ubuntu2604
      - >-
        ./scripts/build-deb.sh
        --name dak-nuggets --version "$TAG_VERSION" --revision 1~ubuntu2604 --arch amd64
        --stage-root stage-bundle-ubuntu2604
        --output dist/dak-nuggets_${TAG_VERSION}-1~ubuntu2604_amd64.deb
        --synopsis "All dak-nuggets helper programs, for DAK"
        --description "Bundles every dak-nuggets helper program (see README.markdown) into a single package."
        --depends "libecal-2.0-3, libedataserver-1.2-27t64"

  - name: bundle-freebsd-pkg
    image: debian:trixie-slim
    depends_on: [gnome-next-meeting-freebsd-pkg]
    failure: ignore
    commands:
      - apt-get update && apt-get install -y --no-install-recommends python3 zstd
      - TAG_VERSION=${CI_COMMIT_TAG#v}
      - >-
        ./scripts/merge-stage-roots.sh --output stage-bundle-freebsd
        gnome-next-meeting/stage-root-freebsd
      - >-
        python3 ./scripts/build-freebsd-pkg.py
        --name dak-nuggets --origin "sysutils/dak-nuggets"
        --version "$TAG_VERSION" --stage-root stage-bundle-freebsd
        --comment "All dak-nuggets helper programs, for DAK"
        --desc "Bundles every dak-nuggets helper program (see README.markdown) into a single package."
        --www "https://github.com/TheHolm/dak-nuggets"
        --output dist/dak-nuggets-${TAG_VERSION}-freebsd-amd64.pkg

  # ---------------------------------------------------------------------
  # Publish
  # ---------------------------------------------------------------------

  - name: publish-github-release
    image: debian:trixie-slim
    depends_on:
      - gnome-next-meeting-deb-trixie
      - gnome-next-meeting-deb-ubuntu2604
      - gnome-next-meeting-freebsd-pkg
      - bundle-deb-trixie
      - bundle-deb-ubuntu2604
      - bundle-freebsd-pkg
    environment:
      GH_TOKEN:
        from_secret: github_token
    commands:
      - apt-get update && apt-get install -y --no-install-recommends ca-certificates curl gnupg
      - mkdir -p -m 755 /etc/apt/keyrings
      - curl -fsSL https://cli.github.com/packages/githubcli-archive-keyring.gpg -o /etc/apt/keyrings/githubcli-archive-keyring.gpg
      - chmod go+r /etc/apt/keyrings/githubcli-archive-keyring.gpg
      - echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main" > /etc/apt/sources.list.d/github-cli.list
      - apt-get update && apt-get install -y --no-install-recommends gh
      - ./scripts/extract-release-notes.sh "$CI_COMMIT_TAG" RELEASE_NOTES.md > /tmp/release-notes.md
      # Idempotent: create the release, or update it in place when a tag is
      # re-released, so republishing the same tag never fails.
      - |
        if gh release view "$CI_COMMIT_TAG" --repo TheHolm/dak-nuggets >/dev/null 2>&1; then
          gh release edit "$CI_COMMIT_TAG" \
            --repo TheHolm/dak-nuggets \
            --title "$CI_COMMIT_TAG" \
            --notes-file /tmp/release-notes.md
          gh release upload "$CI_COMMIT_TAG" dist/* \
            --repo TheHolm/dak-nuggets \
            --clobber
        else
          gh release create "$CI_COMMIT_TAG" dist/* \
            --repo TheHolm/dak-nuggets \
            --title "$CI_COMMIT_TAG" \
            --notes-file /tmp/release-notes.md
        fi
